<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Catch the Coins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--text:#121212;--muted:#6b6f76;--line:rgba(0,0,0,.08);--pink:#fe2c55;--cyan:#25f4ee;--gold:#ffc83d;--green:#00b06f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;background:#e9ebee;color:var(--text);font-family:'Montserrat',system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
input{-webkit-user-select:text;user-select:text;touch-action:auto}

.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#fff;border-radius:54px;box-shadow:0 0 0 11px #1b1b1d,0 0 0 13px #2c2c2f,0 40px 120px rgba(0,0,0,.3)}
.phone.full{position:fixed!important;top:0;left:0;transform-origin:0 0;border-radius:0!important;box-shadow:none!important}
.bgfx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 0%,rgba(37,244,238,.12),transparent 70%),radial-gradient(50% 35% at 90% 20%,rgba(254,44,85,.09),transparent 70%),radial-gradient(70% 40% at 50% 100%,rgba(255,200,61,.10),transparent 70%)}

/* ---------- status bar ---------- */
.status{position:absolute;left:0;right:0;top:0;z-index:30;height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font-weight:700;font-size:15px}
.status .icons{display:flex;gap:6px;align-items:center}
.phone.full .status{display:none}

/* ---------- TikTok-style overlay (generic icons) ---------- */
.tt{position:absolute;top:0;right:0;bottom:0;left:0;z-index:15;pointer-events:none}
.tt .topbar{position:absolute;left:0;right:0;top:52px;height:40px;display:flex;align-items:center;justify-content:center;gap:22px;font-size:17px;font-weight:700;color:rgba(18,18,18,.55)}
.phone.full .tt .topbar{top:calc(6px + env(safe-area-inset-top))}
.tt .topbar b{color:#121212;font-weight:800;position:relative}
.tt .topbar b::after{content:"";position:absolute;left:50%;bottom:-8px;width:26px;height:3px;margin-left:-13px;border-radius:2px;background:#121212}
.tt .topbar .live{position:absolute;left:16px;font-size:12px;font-weight:900;padding:3px 7px;border-radius:6px;border:2px solid #121212;color:#121212}
.tt .topbar svg{position:absolute;right:16px;width:24px;height:24px}
.rail{position:absolute;right:8px;bottom:186px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rail .av{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#ffd76a,#ff9f1c);box-shadow:0 4px 12px rgba(0,0,0,.15);display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px}
.rail .av i{position:absolute;bottom:-9px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--pink);color:#fff;font-style:normal;font-size:16px;font-weight:900;display:grid;place-items:center;line-height:1}
.rail div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#121212}
.rail svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.rail .heart svg{transition:transform .2s}
.rail .heart.on svg{transform:scale(1.25)}
.disc{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#ffd76a 0 22%,#222 23% 60%,#3a3a3a 61%);animation:discspin 4s linear infinite;box-shadow:0 4px 10px rgba(0,0,0,.2)}
@keyframes discspin{to{transform:rotate(360deg)}}
.caption{position:absolute;left:14px;right:80px;bottom:76px;font-size:14px;line-height:1.4;color:#121212}
.caption b{display:block;font-size:16px;font-weight:800}
.caption span{display:block;font-weight:600}
.caption em{display:flex;align-items:center;gap:6px;margin-top:4px;font-style:normal;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden}
.navbar{position:absolute;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:1px solid #efefef;pointer-events:auto}
.navbar div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:#8a8a8a;min-width:56px}
.navbar div.on{color:#121212}
.navbar svg{width:26px;height:26px}
.plus{width:46px;height:30px;border-radius:9px;background:#121212;display:grid;place-items:center;box-shadow:-3px 0 0 var(--cyan),3px 0 0 var(--pink);color:#fff;font-size:24px;font-weight:700;line-height:1}

/* ---------- HUD ---------- */
.hud{position:absolute;left:12px;right:12px;top:58px;z-index:20;display:flex;align-items:center;justify-content:space-between}
.phone.full .hud{top:calc(12px + env(safe-area-inset-top))}
.score{display:flex;align-items:center;gap:8px;padding:7px 16px 7px 7px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.08);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.score img{width:32px;height:32px}
.bump{animation:bump .2s ease-out}
@keyframes bump{50%{transform:scale(1.08)}}
.timer{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:#121212;color:#fff;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.timer i{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px rgba(254,44,85,.3);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.3}}
.timer.hurry{background:var(--pink)}

#game{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none}

/* ---------- black Coins card (basket) ---------- */
.ccard{position:absolute;left:0;top:0;z-index:17;width:190px;height:83px;border-radius:12px;padding:10px 13px;color:#fff;will-change:transform;
  background:#1a1a1a url(data:image/webp;base64,UklGRqgDAABXRUJQVlA4IJwDAACwLwCdASowAvQAPkkkkUYioiGhIGgAUAkJaW7hIE6I3oz0WfJT6WdNYnAPofcTjkENVSbJiHVUmyYWIe21tkNb15yhZHQKg0mmpA/yA8WL1ypRdZoHyjF73ssr6L7Oup/6weJ1P48da+iPQsbwLzMyBAqToyP+Jqc+oB4qx3w+N3UInPOGfAkvs2TKH3+24RDcN8QD99EroIyTDl3GCEBoC/jMgAGaGjOK4Fg2Y1x417mSOJ0zDsY1IXnAprZhDZ9rew3v0O2zG1j9D7iPUTF1Hw/ROdmOCPC8gd6JQDlZOyzdOL2X3nKhUdrcgKchl7wlmCgCMhqqgdR+2zAbWePB6qxBhzPEQhvZSBQIbvzaaK2N+GbcBA9bHy0+EWqWCTQZvc3DwFDipN3rhFXiKReAYKsobdQAtL+O7OkXN4e1fCMDmDqmYdFuVwXd/jjldAeNjfGvcm6I6dBFmqNgxrHm+cB5yr+MBlYASuC/Acy9gkzTk+xydBPUBkSokyByIUwWlTAWcAAA/vgmCHViOw5yzk1Vr7pu25pXYauw05uSjKIikpZ/ORkhYL2LhRGmgrkNdr6uyS6vGX1DKZeaGrJYqm9PT3Q4DFQUQ2m2koKRnsgBTVQcTc4FUxDs1E9i3ItF9QKOxwxwp2FcaZvZHP+IPKBBMNnO+nzYPMIWvxIwORHrPhD3Qvl6QvpiUeahHaCz9CKoG23cG0qKrHQq/BwfYnu2Nm9YHDazTxGTht1QLbSNkZHauFDceSe1Ym1NX3Y622Doq3wDRcP03HpBJlkIoxFu6TWabTF76DXpA3KXKw5MEvS+wiLUIWuPBMGzdvHeZuddW241PnuvEUGEgWBW2+dbid2BLR1xeYGmBuxd9uUQ8G6t87pB+DofuW462xxLX7ta1YxGGeu91dP0SpsUXVprITFJiBxptnvleMsDIl4Acjp/1AzzTpOSnVDsdLuDPQv1WoaJKa+UXLYB7/D4NjBXItelm2ehCBGgotnwihQqfb/YM32u2aB/BnOAn9vOVdfxmXpJR5GREf894Oj5ByzuAk7mc+qDdaIWv1/PCc2C/C51wXitA5GmAjfGxfzRY4VnfVLTuUBKEJA0orC88Z/OkjGuFbgmVzHLaCQlvWMK0mZK8BUbFfvB46/tPQzIGvfSakn7vkTJehlstl3Q84lmHb6rAmCDZQCAKZuMcFUWmdAbnw5NlWKaJOw5QntvvdscUVmUUvAAAAA=) center/100% 100% no-repeat;
  box-shadow:0 14px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.ccard small{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}
.ccard .n{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:28px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ccard .n img{width:26px;height:26px}
.ccard::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 3px rgba(255,200,61,.7),0 0 30px rgba(255,200,61,.6);opacity:0;transition:opacity .25s}
.ccard.glow::after{opacity:1}

/* ---------- overlays ---------- */
.overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .35s}
.overlay.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.overlay.hide .rays,.overlay.hide .bigc{animation-play-state:paused}
.overlay .bigc{width:110px;height:110px;filter:drop-shadow(0 10px 20px rgba(200,140,0,.35));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-6deg)}}
.overlay h1{margin-top:16px;font-size:30px;font-weight:900;line-height:1.1}
.overlay p{margin-top:10px;font-size:15px;font-weight:600;line-height:1.5;color:var(--muted)}
.rules{display:flex;gap:10px;margin-top:16px}
.rules div{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:14px}
.rules img{width:20px;height:20px}.rules .b img{width:28px;height:28px}
.btn{margin-top:22px;width:100%;max-width:300px;border:none;border-radius:14px;padding:16px;font-family:inherit;font-weight:800;font-size:17px;color:#fff;cursor:pointer;background:#121212;box-shadow:-3px 0 0 var(--cyan),3px 0 0 var(--pink),0 10px 24px rgba(0,0,0,.2)}
.btn:active{transform:scale(.98)}
.btn.pink{background:var(--pink);box-shadow:0 10px 24px rgba(254,44,85,.35)}
.btn.ghost{background:transparent;color:#121212;border:1px solid rgba(0,0,0,.15);box-shadow:none;margin-top:10px;font-size:15px}
.rays{position:absolute;left:50%;top:40%;width:640px;height:640px;margin:-320px 0 0 -320px;pointer-events:none;opacity:.6;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,61,.35) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 58%);mask:radial-gradient(circle,#000 0,transparent 58%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win > *:not(.rays){position:relative}
.win .total{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;color:#121212}
.win .total img{width:52px;height:52px}
.win .sub{font-size:14px;font-weight:700;color:var(--muted)}
.count{position:absolute;top:0;right:0;bottom:0;left:0;z-index:41;display:none;align-items:center;justify-content:center;pointer-events:none}
.count.on{display:flex}
.count b{font-size:120px;font-weight:900;color:#121212;text-shadow:-5px 0 var(--cyan),5px 0 var(--pink);animation:cnt .32s ease-out}
@keyframes cnt{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.9}}

/* transfer window */
.modal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(18,18,18,.45);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:400px;border-radius:18px;background:#fff;padding:22px 18px 18px;text-align:center;transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.2,1.3,.4,1);box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal.open .sheet{transform:none}
.sheet h3{font-size:21px;font-weight:900}
.sheet p{margin-top:6px;font-size:14px;line-height:1.45;font-weight:600;color:var(--muted)}
.fld{margin-top:16px;text-align:left}
.fld small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font-family:inherit;font-weight:600;font-size:16px;color:#121212;background:#f4f5f7;border:1px solid rgba(0,0,0,.14);border-radius:10px;padding:12px 13px;outline:none}
.row input:focus{border-color:#121212;box-shadow:0 0 0 3px rgba(18,18,18,.12)}
.fld.err input{border-color:var(--pink);box-shadow:0 0 0 3px rgba(254,44,85,.2);animation:nope .3s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.paste{flex:none;display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:10px;border:1px solid rgba(0,0,0,.14);background:#eef0f2;color:#121212;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.paste svg{width:16px;height:16px}
.prog{height:6px;border-radius:3px;background:#eceef0;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .4s}
.step{margin-top:10px;min-height:18px;font-size:13px;font-weight:700}
.sheet .btn{max-width:none}

/* account screen */
.acct{position:absolute;top:0;right:0;bottom:0;left:0;z-index:55;background:#fff;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.acct.open{transform:none;visibility:visible}
.phone:not(.full) .acct{top:50px}
.acct .head{flex:none;height:52px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;position:relative;border-bottom:1px solid #f0f0f0}
.acct .head svg{position:absolute;left:14px;width:24px;height:24px}
.prof{flex:none;text-align:center;padding:18px 16px 0}
.prof .pa{width:92px;height:92px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,#ffd76a,#ff9f1c);display:grid;place-items:center;font-size:38px;font-weight:900;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.prof h2{margin-top:10px;font-size:19px;font-weight:800;word-break:break-all}
.stats{display:flex;justify-content:center;gap:26px;margin-top:12px}
.stats div{font-size:12px;font-weight:600;color:var(--muted)}
.stats b{display:block;font-size:17px;font-weight:900;color:#121212}
.acct{background:#f6f6f7}
.head2{flex:none;height:46px;display:flex;align-items:center;padding:0 12px}
.head2 svg{width:26px;height:26px}
.btitle{flex:none;padding:6px 18px 0;font-size:28px;font-weight:900;line-height:1.15;word-break:break-word}
.sect{flex:none;padding:22px 18px 0;font-size:18px;font-weight:900}
.acct .ccard{position:relative;left:auto;top:auto;transform:none!important;width:auto;height:auto;margin:18px 14px 0;padding:6.2% 5% 0;aspect-ratio:2.292/1;border-radius:16px}
.acct .ccard small{font-size:16px}
.acct .tx{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
/* tablets: balance screen as a centred column */
.phone.wide .acct > *{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.phone.wide .acct .ccard{width:calc(100% - 28px);max-width:532px}
.phone.wide .acct .tx{width:calc(100% - 32px);max-width:528px}
.phone.wide .acct .sp{max-width:none}
.phone.wide .overlay .btn{max-width:360px}
.acct .ccard .n{margin-top:8px;font-size:50px}
.acct .ccard .n img{width:40px;height:40px}
.tx{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:12px;border-radius:12px;background:#f4f5f7;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.tx.on{opacity:1;transform:none}
.tx .ic{flex:none;width:38px;height:38px;border-radius:10px;background:rgba(0,176,111,.12);display:grid;place-items:center}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-size:14px;font-weight:800}
.tx .t span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.tx .amt{font-size:16px;font-weight:900;color:var(--green);white-space:nowrap}
.acct .sp{flex:1}
.acct .foot{flex:none;padding:0 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.acct .foot .btn{max-width:none;margin-top:0}
.acct .note{margin-top:10px;font-size:11px;font-weight:600;color:#9a9ea6}
#fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:60;pointer-events:none}

.rotate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;display:none;align-items:center;justify-content:center;background:#fff;color:#121212;font-family:'Montserrat',system-ui,sans-serif;font-weight:800;font-size:18px}
.rotate.on{display:flex}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="bgfx"></div>
  <div class="status">
    <span id="clock">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#121212"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#121212"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .8 10.2 10.2 0 0 0 .9 3.7L2 4.9a8.5 8.5 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A7 7 0 0 0 8 4.2a7 7 0 0 0-4.7 1.9l1.1 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c-.6 0-1.1.2-1.5.6L8 11.5l1.5-1.7c-.4-.4-.9-.6-1.5-.6Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#121212" opacity=".5"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#121212"/><rect x="24" y="4.5" width="2" height="4" rx="1" fill="#121212" opacity=".5"/></svg>
    </span>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const COIN = $('coinSrc').src;
  document.querySelectorAll('img[data-coin]').forEach(i => i.src = COIN);
  const coinImg = new Image(); coinImg.src = COIN;
  const fmt = n => n.toLocaleString('en-US');
  let lastVib = 0;
  const vib = (p, force) => {
    if (!navigator.vibrate) return;
    const now = performance.now(); if (!force && now - lastVib < 90) return; lastVib = now;
    try { navigator.vibrate(p); } catch(_){}
  };
  const GAME_SEC = 7, SMALL = 100, BIG = 500;

  // cached DOM refs (no lookups inside the game loop)
  const phoneEl = $('phone'), card = $('card'), scoreEl = $('score'), scoreN = $('scoreN'), cardN = $('cardN'),
        timeN = $('timeN'), timerEl = $('timer');
  const cv = $('game'), cx = cv.getContext('2d'), fxc = $('fx'), fx = fxc.getContext('2d');
  let S = 1, PW = 390, PH = 844, DPR = 1, phoneLeft = 0;
  const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);

  // ---------- pre-rendered sprites (shadows are baked in once, not blurred every frame) ----------
  const SPR_R = 30;
  let sprSmall = null, sprBig = null, trailSpr = null, popSmall = null, popBig = null, sprDPR = 0;
  function mk(w, h){
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return [c, g];
  }
  function coinSprite(big){
    const pad = big ? 26 : 16, size = SPR_R * 2 + pad * 2, [c, g] = mk(size, size);
    g.drawImage(coinImg, pad, pad, SPR_R * 2, SPR_R * 2);
    return { c, half: size / 2 };
  }
  function makeTrail(){
    const w = SPR_R * 1.1, h = SPR_R * 3.2, [c, g] = mk(w, h);
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, 'rgba(255,200,61,0)'); gr.addColorStop(1, 'rgba(255,200,61,.35)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, h); g.lineTo(w, h); g.lineTo(w / 2, 0); g.fill();
    return c;
  }
  function popSprite(txt, big){
    const fs = big ? 32 : 24, font = '900 ' + fs + 'px Montserrat, system-ui, sans-serif';
    const m = document.createElement('canvas').getContext('2d'); m.font = font;
    const w = Math.ceil(m.measureText(txt).width) + 28, h = fs + 28, [c, g] = mk(w, h);
    g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.shadowColor = '#fff'; g.shadowBlur = 12; g.strokeStyle = '#fff'; g.lineWidth = 5; g.strokeText(txt, w / 2, h / 2);
    g.shadowBlur = 0; g.fillStyle = big ? '#d48a00' : '#121212'; g.fillText(txt, w / 2, h / 2);
    return { c, w, h };
  }
  function buildPops(){ popSmall = popSprite('+' + SMALL, false); popBig = popSprite('+' + BIG, true); }
  function buildSprites(force){
    if (!force && sprDPR === DPR) return;
    sprDPR = DPR; trailSpr = makeTrail(); buildPops();
    if (coinImg.complete && coinImg.naturalWidth){ sprSmall = coinSprite(false); sprBig = coinSprite(true); }
  }
  coinImg.onload = () => buildSprites(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildPops);

  // ---------- phone & tablet full screen, computer: phone frame ----------
  function fit(){
    const vv = window.visualViewport, W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight;
    const touch = W < 500 || mq('(pointer: coarse)') || mq('(hover: none)');
    $('rotate').classList.toggle('on', touch && W > H && H < 500);
    if (touch){ S = W < 500 ? W / 390 : Math.max(1, Math.min(W / 390, H / 800)); PW = W / S; PH = H / S; }
    else { S = Math.min(1, (H - 40) / 844, (W - 40) / 390); PW = 390; PH = 844; }
    phoneEl.style.width = PW + 'px'; phoneEl.style.height = PH + 'px';
    phoneEl.style.transform = phoneEl.style.webkitTransform = 'scale(' + S + ')';
    phoneEl.classList.toggle('full', touch);
    phoneEl.classList.toggle('wide', touch && PW > 520);
    // canvas resolution capped at 2x: on tablets it used to reach 4x (16x the pixels)
    DPR = Math.min(2, (window.devicePixelRatio || 1) * Math.max(1, S));
    [cv, fxc].forEach(c => {
      const w = Math.round(PW * DPR), h = Math.round(PH * DPR);
      if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
      c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
    });
    buildSprites();
    cardX = Math.min(Math.max(cardX, 0), PW - CW); targetX = cardX; placedX = NaN; placeCard();
    idle = false;
  }
  let fitQ = 0;
  const qfit = () => { if (!fitQ) fitQ = requestAnimationFrame(() => { fitQ = 0; fit(); }); };
  const clock = () => { const d = new Date(); $('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2,'0'); };
  clock(); setInterval(clock, 10000);

  // ---------- Coins card (basket) ----------
  const CW = 190, CH = 84;
  let cardX = (390 - CW) / 2, targetX = cardX, placedX = NaN, placedY = NaN;
  const cardY = () => PH - CH - 56;                             // near the bottom
  function placeCard(){
    const y = cardY();
    if (Math.abs(cardX - placedX) < .05 && y === placedY) return;   // skip style writes when the card is still
    placedX = cardX; placedY = y;
    card.style.transform = 'translate3d(' + cardX.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
  }
  const toLocalX = x => (x - phoneLeft) / S;
  let dragging = false, grabOff = CW / 2;
  phoneEl.addEventListener('pointerdown', e => {
    if (!running) return;
    phoneLeft = phoneEl.getBoundingClientRect().left;          // measured once per touch, not on every move
    dragging = true; const x = toLocalX(e.clientX);
    grabOff = (x >= cardX && x <= cardX + CW) ? x - cardX : CW / 2; targetX = x - grabOff;
  });
  addEventListener('pointermove', e => { if (dragging) targetX = toLocalX(e.clientX) - grabOff; }, { passive: true });
  addEventListener('pointerup', () => dragging = false);
  addEventListener('pointercancel', () => dragging = false);
  addEventListener('keydown', e => { if (e.key === 'ArrowLeft') targetX -= 50; if (e.key === 'ArrowRight') targetX += 50; });

  // ---------- particles (sparks, rings) ----------
  let parts = [];
  const SPARK_COLS = ['#ffd84a','#ffb300','#fff3b0','#25f4ee','#fe2c55'];
  function burst(x, y, big){
    const n = big ? 30 : 16;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, v = (big ? 220 : 150) + Math.random() * 160;
      parts.push({ k: 0, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, r: 2 + Math.random() * 3, c: SPARK_COLS[i % 5], life: .6 + Math.random() * .4, t: 0 });
    }
    parts.push({ k: 1, x, y, r: 10, max: big ? 90 : 55, life: .45, t: 0 });
  }
  function drawParts(dt){
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i]; p.t += dt;
      if (p.t >= p.life){ parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      const a = 1 - p.t / p.life;
      if (p.k === 0){
        p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        cx.globalAlpha = a; cx.fillStyle = p.c;
        cx.beginPath(); cx.arc(p.x, p.y, p.r * a + .5, 0, 7); cx.fill();
      } else {
        const rr = p.r + (p.max - p.r) * (1 - a);
        cx.strokeStyle = '#ffc83d';
        cx.globalAlpha = a * .35; cx.lineWidth = 10 * a; cx.beginPath(); cx.arc(p.x, p.y, rr, 0, 7); cx.stroke();
        cx.globalAlpha = a; cx.lineWidth = 4 * a; cx.beginPath(); cx.arc(p.x, p.y, rr, 0, 7); cx.stroke();
      }
    }
    cx.globalAlpha = 1;
  }

  // ---------- "+100" pops, drawn on the canvas instead of new DOM nodes ----------
  let pops = [];
  function drawPops(dt){
    for (let i = pops.length - 1; i >= 0; i--){
      const p = pops[i]; p.t += dt;
      if (p.t >= 1){ pops[i] = pops[pops.length - 1]; pops.pop(); continue; }
      const spr = p.big ? popBig : popSmall; if (!spr) continue;
      let op, dy, s;
      if (p.t < .2){ const e = p.t / .2; op = e; dy = -16 * e; s = .5 + .7 * e; }
      else { const e = (p.t - .2) / .8; op = 1 - e; dy = -16 - 54 * e; s = 1.2 - .2 * e; }
      const w = spr.w * s, h = spr.h * s;
      cx.globalAlpha = op; cx.drawImage(spr.c, p.x - w / 2, p.y + 14 + dy - h / 2, w, h);
    }
    cx.globalAlpha = 1;
  }

  // ---------- game ----------
  let coins = [], score = 0, caught = 0, running = false, spawnT = 0, last = 0, endAt = 0;
  let lastSec = -1, hurry = false, idle = false, catchAnim = null, bumpA = [];
  function spawn(){
    const big = Math.random() < .2, r = big ? 30 : 20 + Math.random() * 4;
    coins.push({ x: r + Math.random() * (PW - 2 * r), y: 70 - r, r, v: 260 + Math.random() * 140, rot: Math.random() * 6.28, vr: (Math.random() - .5) * 4, big, wob: Math.random() * 6.28 });
  }
  function setScore(anim){
    const s = fmt(score); scoreN.textContent = s; cardN.textContent = s;    // both places
  }
  function onCatch(c, top){
    const val = c.big ? BIG : SMALL; score += val; caught++; setScore(true);
    card.classList.add('glow'); clearTimeout(card._g); card._g = setTimeout(() => card.classList.remove('glow'), 250);
    burst(c.x, top, c.big); pops.push({ x: c.x, y: top - 16, big: c.big, t: 0 });
    vib(c.big ? [20,30,20] : 8, c.big);
  }
  function frame(t){
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (running){
      const left = Math.max(0, (endAt - t) / 1000), sec = Math.ceil(left);
      if (sec !== lastSec){
        lastSec = sec; timeN.textContent = sec;
        const h = left <= 2; if (h !== hurry){ hurry = h; timerEl.classList.toggle('hurry', h); }
      }
      spawnT -= dt;
      if (spawnT <= 0){ spawn(); if (Math.random() < .5) spawn(); spawnT = .07 + Math.random() * .06; }
      targetX = Math.min(Math.max(targetX, 0), PW - CW);
      cardX += (targetX - cardX) * Math.min(1, dt * 20);
      placeCard();
      if (left <= 0) finish();
    }
    // nothing on screen -> clear once and stop drawing
    if (!coins.length && !parts.length && !pops.length){
      if (!idle){ cx.clearRect(0, 0, PW, PH); idle = true; }
      return;
    }
    idle = false;
    cx.clearRect(0, 0, PW, PH);
    const top = cardY(), L = cardX, R = cardX + CW;
    for (let i = coins.length - 1; i >= 0; i--){
      const c = coins[i];
      c.y += c.v * dt; c.rot += c.vr * dt; c.wob += dt * 3; c.x += Math.sin(c.wob) * 24 * dt;
      if (running && c.y + c.r * .4 >= top && c.y - c.r <= top + 26 && c.x >= L - c.r * .3 && c.x <= R + c.r * .3){
        coins[i] = coins[coins.length - 1]; coins.pop();
        onCatch(c, top);
        continue;
      }
      if (c.y - c.r > PH){ coins[i] = coins[coins.length - 1]; coins.pop(); continue; }
      const spr = c.big ? sprBig : sprSmall;
      if (spr){
        const k = c.r / SPR_R, hh = spr.half * k, sc = Math.abs(Math.cos(c.rot)) * .3 + .7, hw = hh * sc;
        cx.drawImage(spr.c, c.x - hw, c.y - hh, hw * 2, hh * 2);
      }
    }
    drawParts(dt);
    drawPops(dt);
  }
  function start(){
    coins = []; parts = []; pops = []; score = 0; caught = 0; spawnT = 0; setScore(false);
    lastSec = -1; hurry = false; timeN.textContent = GAME_SEC; timerEl.classList.remove('hurry');
    ['startScr','winScr'].forEach(id => $(id).classList.add('hide'));
    $('acct').classList.remove('open');
    // 3-2-1 countdown
    const cnt = $('count'), n = $('countN'); let k = 3; cnt.classList.add('on');
    const tick = () => {
      if (k === 0){ cnt.classList.remove('on'); endAt = performance.now() + GAME_SEC * 1000; running = true; return; }
      n.textContent = k; n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; vib(10, true); k--; setTimeout(tick, 320);
    };
    tick();
  }
  function countTo(target, el, dur){
    const t0 = performance.now();
    (function step(t){ const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(target * e)); if (k < 1) requestAnimationFrame(step); })(t0);
  }
  function finish(){
    running = false; dragging = false;
    setTimeout(openAccount, 450);
  }
  $('startBtn').onclick = start;
  $('againBtn').onclick = start;
  $('again2').onclick = start;

  // ---------- transfer: straight to the account screen ----------
  const A1 = ['sunny','pixel','lucky','dreamy','cosmic','golden','happy','wild','neon','cozy'], A2 = ['vibes','star','coin','fox','cat','wave','day','life','moon','beat'];
  const any = x => x[Math.floor(Math.random() * x.length)];
  let nick = any(A1) + '.' + any(A2) + Math.floor(10 + Math.random() * 990);
  $('transferBtn').onclick = () => openAccount();
  function openAccount(){
    $('pName').textContent = nick;
    $('acN').textContent = '0'; $('tx').classList.remove('on'); $('txN').textContent = '+' + fmt(score);
    $('acct').classList.add('open');
    setTimeout(() => {
      $('acCard').classList.add('glow'); countTo(score, $('acN'), 1300); $('tx').classList.add('on'); confetti(); vib([40,30,40], true);
      setTimeout(() => $('acCard').classList.remove('glow'), 1600);
    }, 700);
  }

  // ---------- confetti ----------
  let bits = [], conf = false;
  function confetti(){
    const cols = ['#ffd84a','#25f4ee','#fe2c55','#121212','#ffb300'];
    for (let i = 0; i < 150; i++){
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 300 + Math.random() * 420;
      bits.push({ x: PW / 2, y: PH * .45, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - .5) * 14, c: cols[i % cols.length], life: 2.6 + Math.random() });
    }
    if (conf) return; conf = true; let lt = performance.now();
    (function f(t){
      const dt = Math.min(.05, (t - lt) / 1000); lt = t;
      fx.setTransform(DPR, 0, 0, DPR, 0, 0); fx.clearRect(0, 0, PW, PH);
      bits = bits.filter(b => (b.life -= dt) > 0);
      for (const b of bits){
        b.vy += 520 * dt; b.vx *= .99; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        const co = Math.cos(b.r) * DPR, si = Math.sin(b.r) * DPR, hh = b.h * Math.abs(Math.cos(b.r * 1.3));
        fx.setTransform(co, si, -si, co, b.x * DPR, b.y * DPR);
        fx.globalAlpha = Math.min(1, b.life); fx.fillStyle = b.c; fx.fillRect(-b.w / 2, -b.h / 2, b.w, hh);
      }
      fx.setTransform(DPR, 0, 0, DPR, 0, 0); fx.globalAlpha = 1;
      if (bits.length) requestAnimationFrame(f); else { conf = false; fx.clearRect(0, 0, PW, PH); }
    })(lt);
  }

  fit();
  addEventListener('resize', qfit);
  addEventListener('orientationchange', () => setTimeout(qfit, 150));
  if (window.visualViewport) visualViewport.addEventListener('resize', qfit);
  last = performance.now(); requestAnimationFrame(frame);
})();
</script>
